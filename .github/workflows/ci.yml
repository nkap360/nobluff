name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Payment replay expected failure and fixed comparison
        working-directory: examples/double-charge
        run: |
          python -m unittest -v test_payments
          set +e
          python replay_check.py
          code=$?
          set -e
          test "$code" -eq 1
          python replay_check.py --fixed
  detector-and-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Detector vet and tests
        working-directory: detector
        run: |
          go vet ./...
          go test -count=1 -v ./...
      - name: Compare all six binaries byte for byte with pinned source build
        run: python scripts/build.py --check
      - name: Verify the exact npm tarball and run its synthetic host smoke
        run: python scripts/verify_package.py
