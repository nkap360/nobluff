name: release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified version tag to npm and GitHub
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source, shipped binaries and exact tarball
        run: |
          cd detector
          go vet ./...
          go test -count=1 ./...
          cd ..
          python -m unittest discover -s tests -v
          python scripts/build.py --check
          python scripts/verify_package.py
          mkdir -p .build/candidate/plugin
          git archive --format=zip --output=.build/candidate/plugin/nobluff-plugin.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            .build/candidate/*.tgz
            .build/candidate/verification.json
            .build/candidate/plugin/*.zip
            bin/build-manifest.json
          if-no-files-found: error
          include-hidden-files: true
  publish:
    if: inputs.publish
    needs: candidate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: verified
      - name: Require version tag and tested package digest
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node - <<'NODE'
          const fs=require('fs'),p=require('path'),crypto=require('crypto');
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(p.join(d,e.name)):[p.join(d,e.name)]);
          const files=walk('verified'), manifest=JSON.parse(fs.readFileSync(files.find(x=>x.endsWith('verification.json'))));
          const archive=files.find(x=>x.endsWith('/nobluff-'+manifest.version+'.tgz'));
          if(process.env.RELEASE_REF_TYPE!=='tag'||process.env.RELEASE_REF!=='v'+manifest.version)throw Error('version tag required');
          if(!archive||crypto.createHash('sha256').update(fs.readFileSync(archive)).digest('hex')!==manifest.sha256)throw Error('archive digest mismatch');
          fs.writeFileSync('archive-path.txt',archive);
          NODE
          npm install --global npm@11.6.2
      - name: Publish exact tested archive using configured trusted publisher
        run: npm publish "$(cat archive-path.txt)" --provenance --access public
      - name: Publish GitHub release after registry success
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: gh release create "$RELEASE_REF" $(find verified -type f -name '*.tgz' -o -name '*.zip' -o -name '*manifest.json' -o -name 'verification.json') --verify-tag --generate-notes
